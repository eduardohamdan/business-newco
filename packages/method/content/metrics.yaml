# Catálogo de indicadores. `source: raiox` = calculado do extrato; `manual` = informado; `ritual` = coletado no check-in.
- { code: folego_caixa_dias, name: "Fôlego de caixa", unit: dias, direction: up, dimension: caixa_financas, source: raiox, periodicity: monthly, tolerance: 5, description: "Quantos dias a empresa opera com o saldo atual, considerando a média de saídas." }
- { code: meses_caixa_negativo, name: "Meses com caixa negativo", unit: count, direction: down, dimension: caixa_financas, source: raiox, periodicity: monthly, tolerance: 0, description: "Meses, dos últimos 3, em que as saídas superaram as entradas." }
- { code: despesas_pessoais_pj_pct, name: "Despesas pessoais na conta PJ", unit: pct, direction: down, dimension: caixa_financas, source: raiox, periodicity: monthly, tolerance: 2, description: "Percentual das saídas da conta PJ com indício de gasto pessoal." }
- { code: margem_bruta_pct, name: "Margem bruta", unit: pct, direction: up, dimension: caixa_financas, source: manual, periodicity: monthly, tolerance: 2, description: "(Receita - custos variáveis) / receita." }
- { code: inadimplencia_pct, name: "Inadimplência", unit: pct, direction: down, dimension: caixa_financas, source: manual, periodicity: monthly, tolerance: 2, description: "Valor vencido e não recebido / valor faturado no mês." }
- { code: tarifas_bancarias_pct, name: "Tarifas e juros bancários", unit: pct, direction: down, dimension: caixa_financas, source: raiox, periodicity: monthly, tolerance: 0.5, description: "Tarifas, IOF e juros / entradas." }
- { code: concentracao_receita_pct, name: "Concentração de receita", unit: pct, direction: down, dimension: vendas_clientes, source: raiox, periodicity: monthly, tolerance: 5, description: "Participação do maior pagador nas entradas." }
- { code: faturamento_mensal, name: "Faturamento mensal", unit: brl_cents, direction: up, dimension: vendas_clientes, source: raiox, periodicity: monthly, tolerance: 0, description: "Entradas operacionais do mês (exclui transferências e empréstimos)." }
- { code: ticket_medio, name: "Ticket médio", unit: brl_cents, direction: up, dimension: vendas_clientes, source: manual, periodicity: monthly, tolerance: 0, description: "Faturamento / número de vendas." }
- { code: contatos_comerciais_semana, name: "Contatos comerciais por semana", unit: count, direction: up, dimension: vendas_clientes, source: ritual, periodicity: weekly, tolerance: 2, description: "Ligações, mensagens e visitas ativas a potenciais clientes." }
- { code: clientes_reativados_mes, name: "Clientes reativados", unit: count, direction: up, dimension: vendas_clientes, source: ritual, periodicity: monthly, tolerance: 1, description: "Clientes inativos há 90+ dias que voltaram a comprar." }
- { code: clientes_indicacao_mes, name: "Clientes por indicação", unit: count, direction: up, dimension: vendas_clientes, source: ritual, periodicity: monthly, tolerance: 1, description: "Novos clientes vindos de indicação." }
- { code: conversao_whatsapp_pct, name: "Conversão no WhatsApp", unit: pct, direction: up, dimension: marketing_marca, source: manual, periodicity: monthly, tolerance: 2, description: "Conversas comerciais que viraram venda." }
- { code: leads_semana, name: "Leads por semana", unit: count, direction: up, dimension: marketing_marca, source: ritual, periodicity: weekly, tolerance: 2, description: "Novos contatos interessados por semana." }
- { code: origem_registrada_pct, name: "Clientes com origem registrada", unit: pct, direction: up, dimension: marketing_marca, source: manual, periodicity: monthly, tolerance: 5, description: "Percentual de novos clientes com a origem anotada." }
- { code: avaliacoes_publicas_mes, name: "Avaliações públicas no mês", unit: count, direction: up, dimension: marketing_marca, source: ritual, periodicity: monthly, tolerance: 1, description: "Novas avaliações no Google ou redes." }
- { code: retrabalho_mes, name: "Retrabalhos no mês", unit: count, direction: down, dimension: operacao_entrega, source: ritual, periodicity: monthly, tolerance: 1, description: "Entregas refeitas ou corrigidas." }
- { code: entregas_no_prazo_pct, name: "Entregas no prazo", unit: pct, direction: up, dimension: operacao_entrega, source: manual, periodicity: monthly, tolerance: 3, description: "Pedidos ou serviços entregues no prazo combinado." }
- { code: reclamacoes_mes, name: "Reclamações no mês", unit: count, direction: down, dimension: operacao_entrega, source: ritual, periodicity: monthly, tolerance: 1, description: "Reclamações registradas de clientes." }
- { code: custo_variavel_pct, name: "Custo variável sobre receita", unit: pct, direction: down, dimension: operacao_entrega, source: raiox, periodicity: monthly, tolerance: 2, description: "Compras e insumos / entradas." }
- { code: papeis_definidos_pct, name: "Pessoas com papel definido", unit: pct, direction: up, dimension: pessoas_lideranca, source: manual, periodicity: cycle, tolerance: 0, description: "Percentual da equipe com responsabilidades escritas." }
- { code: reunioes_realizadas_pct, name: "Reuniões semanais realizadas", unit: pct, direction: up, dimension: pessoas_lideranca, source: ritual, periodicity: monthly, tolerance: 10, description: "Reuniões feitas / previstas." }
- { code: horas_operacionais_dono_semana, name: "Horas operacionais do dono", unit: hours, direction: down, dimension: pessoas_lideranca, source: ritual, periodicity: weekly, tolerance: 2, description: "Horas por semana que o dono passa executando tarefas operacionais." }
- { code: rotatividade_trimestral_pct, name: "Rotatividade no trimestre", unit: pct, direction: down, dimension: pessoas_lideranca, source: manual, periodicity: cycle, tolerance: 2, description: "Desligamentos / equipe média no trimestre." }
- { code: equipe_com_meta_pct, name: "Equipe com meta", unit: pct, direction: up, dimension: direcao_foco, source: manual, periodicity: monthly, tolerance: 0, description: "Pessoas com meta mensal acompanhada." }
- { code: indicadores_atualizados_pct, name: "Indicadores atualizados", unit: pct, direction: up, dimension: direcao_foco, source: system, periodicity: weekly, tolerance: 10, description: "Indicadores do painel atualizados na semana." }
- { code: direcao_definida_pct, name: "Direção em uma página", unit: pct, direction: up, dimension: direcao_foco, source: manual, periodicity: cycle, tolerance: 0, description: "Itens do plano de uma página concluídos (visão, metas, apostas, números)." }
- { code: reunioes_socios_pct, name: "Reuniões de sócios realizadas", unit: pct, direction: up, dimension: direcao_foco, source: ritual, periodicity: cycle, tolerance: 0, description: "Reuniões mensais de resultado entre sócios realizadas / previstas." }
- { code: rituais_realizados_pct, name: "Rituais semanais realizados", unit: pct, direction: up, dimension: direcao_foco, source: system, periodicity: monthly, tolerance: 10, description: "Rituais respondidos / enviados." }
